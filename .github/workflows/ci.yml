name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nosbp
          POSTGRES_PASSWORD: nosbp
          POSTGRES_DB: nosbp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nosbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nosbp:nosbp@localhost:5432/nosbp_test
      DATABASE_URL: postgresql+asyncpg://nosbp:nosbp@localhost:5432/nosbp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить Poetry
        run: pipx install poetry

      - name: Установить зависимости
        run: poetry install --with dev

      - name: Линтер
        run: poetry run ruff check .

      - name: Формат
        run: poetry run ruff format --check .

      - name: Типы
        run: poetry run mypy

      - name: Миграции применяются на чистой базе
        run: poetry run alembic upgrade head

      - name: Тесты
        run: poetry run pytest -q
