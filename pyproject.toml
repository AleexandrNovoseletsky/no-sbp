[project]
name = "nosbp"
version = "0.2.0"
description = "Генерация QR-кодов для оплаты по реквизитам (ГОСТ Р 56042-2014)"
authors = [
    {name = "Alexandr Novoseletsky", email = "night2324@yandex.ru"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.0,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "segno (>=1.6.6,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "boto3 (>=1.36.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "argon2-cffi (>=23.1)",
    "pyotp (>=2.9)",
    "jinja2 (>=3.1)",
    "python-multipart (>=0.0.20)",
    "httpx (>=0.28,<0.29)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.3.0,<9.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "mypy (>=1.14.0,<2.0.0)",
]

[project.scripts]
nosbp = "nosbp.scripts.manage:main"

[tool.poetry]
packages = [{include = "nosbp", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=1.0.0,<2.0.0"
httpx = ">=0.28.0,<0.29.0"
ruff = ">=0.15.0,<0.16.0"
mypy = ">=1.14.0,<2.0.0"
opencv-python-headless = ">=4.10"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    # Правила про «неоднозначные» символы рассчитаны на англоязычный код
    # и ругаются на каждую русскую букву в комментариях и сообщениях.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы длинные говорящие имена и магические числа.
"tests/*" = ["E501"]
# Миграции генерирует Alembic: длинные строки в них — не наш стиль,
# а вывод генератора, и подгонять его вручную бессмысленно.
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
packages = ["nosbp"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["segno.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
