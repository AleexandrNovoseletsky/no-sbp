{% extends "base.html" %}
{% block title %}Установка пароля — NoSBP{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>Установите пароль</h1>
  {% if invited_email %}
    <p class="sub">Для аккаунта <span class="mono">{{ invited_email }}</span>.</p>
  {% else %}
    <p class="sub">После этого вы сразу войдёте в кабинет.</p>
  {% endif %}

  <form method="post" action="{{ cabinet_prefix }}/password/{{ token }}">
    <div class="field spaced">
      <label for="password">Пароль</label>
      <input id="password" type="password" name="password" required autofocus
             autocomplete="new-password">
      <span class="hint">Не короче 12 символов, буквы и цифры.</span>
    </div>
    <div class="field spaced">
      <label for="password_repeat">Пароль ещё раз</label>
      <input id="password_repeat" type="password" name="password_repeat" required
             autocomplete="new-password">
    </div>
    <div class="actions">
      <button type="submit">Сохранить и войти</button>
    </div>
  </form>
</div>
{% endblock %}
