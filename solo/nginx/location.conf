# Вариант 1: сервис живёт по пути на существующем сайте.
#
# Ни нового домена, ни отдельного сертификата — ничего ждать не нужно.
# Адрес картинки получается такой:
#
#   https://example.com/qr?token=КЛЮЧ&sum=4700000&purpose=Заказ+1234
#
# Установка: вставьте блок limit_req_zone в http-секцию (обычно это
# /etc/nginx/nginx.conf), а блок location — внутрь server-блока вашего
# сайта, который слушает 443. Затем:
#
#   sudo nginx -t && sudo systemctl reload nginx

# --- в http-секцию, рядом с другими limit_req_zone ------------------------
# Картинки запрашиваются пачками, когда почтовый клиент открывает письмо,
# поэтому лимит держится заметно выше обычной нагрузки.
limit_req_zone $binary_remote_addr zone=qr_solo:10m rate=20r/s;

# --- в server-блок сайта --------------------------------------------------
location = /qr {
    # Сервис умеет только отдавать картинку.
    limit_except GET {
        deny all;
    }

    limit_req zone=qr_solo burst=40 nodelay;

    # Завершающая часть адреса подменяется: снаружи /qr, внутри /v1/qr.
    # Строка запроса передаётся дальше сама.
    proxy_pass http://127.0.0.1:8081/v1/qr;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Именно $remote_addr, а не $proxy_add_x_forwarded_for: клиент может
    # прислать свой заголовок, и тот оказался бы в начале списка.
    proxy_set_header X-Forwarded-For $remote_addr;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# Проверка живости — только с самого сервера.
location = /qr-health {
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:8081/health;
    proxy_set_header Host $host;
}
