# Вариант 2: сервис живёт на отдельном поддомене.
#
# Требует A-записи в DNS и своего сертификата, зато адрес короткий
# и сервис ничем не связан с сайтом:
#
#   https://qr.example.com/v1/qr?token=КЛЮЧ&sum=4700000&purpose=Заказ+1234
#
# Установка:
#   sudo cp solo/nginx/subdomain.conf /etc/nginx/sites-available/nosbp-solo.conf
#   sudo ln -s /etc/nginx/sites-available/nosbp-solo.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d qr.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Перед первым запуском заменить example.com на свой домен.

limit_req_zone $binary_remote_addr zone=qr_solo_host:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name qr.example.com;

    # Проверка владения доменом для certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name qr.example.com;

    ssl_certificate     /etc/letsencrypt/live/qr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Строка запроса не пишется: в ней передаются ключ доступа и данные
    # плательщика. В журнал идёт только путь.
    access_log /var/log/nginx/nosbp-solo-access.log;
    error_log  /var/log/nginx/nosbp-solo-error.log;

    location = /health {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location = /v1/qr {
        limit_except GET {
            deny all;
        }

        limit_req zone=qr_solo_host burst=40 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Всё остальное сервис не обслуживает.
    location / {
        return 404;
    }
}
