# Продакшен: приложение и база. Объектное хранилище — внешнее,
# у провайдера, поэтому MinIO здесь нет.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d
# Все секреты берутся из файла .env рядом с этим файлом.

services:
  postgres:
    image: postgres:17-alpine
    container_name: nosbp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    image: ${IMAGE:-nosbp:latest}
    container_name: nosbp-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      # Наружу порт не открывается: перед сервисом стоит обратный прокси,
      # он же терминирует HTTPS.
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  postgres-data:
