# Конфигурация nginx для NoSBP.
#
# Установка:
#   sudo cp deploy/nginx/nosbp.conf /etc/nginx/sites-available/nosbp.conf
#   sudo ln -s /etc/nginx/sites-available/nosbp.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Перед первым запуском заменить:
#   example.com          — домен сервиса
#   /console             — путь панели управления (ADMIN_PATH_PREFIX)
#   203.0.113.0/24       — сети, которым разрешён доступ к панели

# ---------------------------------------------------------------------------
# Ограничение частоты запросов
# ---------------------------------------------------------------------------
# Генерация QR-кодов: обращения приходят от почтовых клиентов пачками при
# открытии писем, поэтому лимит держится заведомо выше обычной нагрузки.
limit_req_zone $binary_remote_addr zone=nosbp_api:10m rate=30r/s;

# Вход в панель: защита от подбора пароля на уровне прокси. Приложение
# дополнительно блокирует учётную запись после нескольких неудач.
limit_req_zone $binary_remote_addr zone=nosbp_login:1m rate=6r/m;

# Запрос письма о восстановлении пароля. Приложение ограничивает число
# писем на один адрес, здесь ограничивается число запросов с одного
# адреса: иначе формой можно перебирать чужие адреса пачками.
limit_req_zone $binary_remote_addr zone=nosbp_reset:1m rate=3r/m;

limit_req_status 429;

# ---------------------------------------------------------------------------
# Журнал доступа
# ---------------------------------------------------------------------------
# Строка запроса не записывается: в ней передаются ключ API и данные
# плательщика. Пишется только путь.
log_format nosbp '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time';

# ---------------------------------------------------------------------------
# HTTP: перенаправление на HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Проверка владения доменом для certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Директива доступна с nginx 1.25.1. Установка свежей версии описана
    # в README, раздел «Развёртывание».
    http2 on;

    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/nosbp-access.log nosbp;
    error_log  /var/log/nginx/nosbp-error.log;

    server_tokens off;

    # Логотипы организаций загружаются через панель; всё остальное — формы.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # -----------------------------------------------------------------------
    # Панель управления
    # -----------------------------------------------------------------------
    # Путь совпадает с ADMIN_PATH_PREFIX. Доступ разрешён только с
    # перечисленных адресов: пароль и одноразовый код остаются основной
    # защитой, но снаружи панель не отвечает.
    #
    # Префикс объявлен через ^~ и без завершающего слэша: иначе запрос
    # к /console без слэша не попал бы под это правило и ушёл бы в общий
    # location в обход ограничения по адресу.
    location ^~ /console {
        allow 203.0.113.0/24;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    # Отдельный лимит на страницу входа.
    location = /console/login {
        allow 203.0.113.0/24;
        deny all;

        limit_req zone=nosbp_login burst=3 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    # -----------------------------------------------------------------------
    # Личный кабинет заказчика
    # -----------------------------------------------------------------------
    # Путь публичный, ограничения по адресу нет. От подбора пароля
    # защищают лимит запросов и блокировка учётной записи в приложении.
    location = /cabinet/login {
        limit_req zone=nosbp_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    location = /cabinet/register {
        limit_req zone=nosbp_login burst=3 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    # Запрос ссылки для восстановления пароля.
    location = /cabinet/forgot {
        limit_req zone=nosbp_reset burst=2 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    # Переход по ссылке из письма: сюда попадают и установка пароля,
    # и подтверждение адреса. Лимит мягче — по одной ссылке человек
    # может пройти несколько раз, ошибившись с паролем.
    location ^~ /cabinet/password/ {
        limit_req zone=nosbp_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    location ^~ /cabinet/confirm/ {
        limit_req zone=nosbp_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    # -----------------------------------------------------------------------
    # Проверка живости
    # -----------------------------------------------------------------------
    # Доступна только с самого сервера. Для внешнего мониторинга сюда
    # добавляется адрес системы наблюдения.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;
    }

    # -----------------------------------------------------------------------
    # Генерация QR-кодов
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=nosbp_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params_nosbp;

        # Картинка одного и того же счёта не меняется; заголовки
        # кэширования проставляет приложение, здесь они только проходят.
        proxy_buffering on;
    }
}
